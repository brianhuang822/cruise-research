name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Dataset is up to date with curated CSVs
        run: python3 scripts/build.py --check
      - name: Unit tests (incl. JS/Python pricing parity)
        run: python3 -m unittest discover -s tests -v
      - name: Lint
        run: ruff check scripts tests
      - name: Format
        run: ruff format --check scripts tests
      - name: aislop quality gate
        run: |
          npx --yes aislop@0.19.1 ci . > "$RUNNER_TEMP/aislop.json"
          python3 - "$RUNNER_TEMP/aislop.json" <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          score, errors = report["score"], report["summary"]["errors"]
          print(f"aislop score {score}, errors {errors}")
          sys.exit(0 if score >= 90 and errors == 0 else 1)
          EOF
